//stock non class-specific binds
//Made with cfg.tf - custom Team Fortress 2 config generator

sensitivity 1.4
bind "UPARROW" "load_itempreset 0"
bind "LEFTARROW" "load_itempreset 1"
bind "DOWNARROW" "load_itempreset 2"
bind "RIGHTARROW" "load_itempreset 3"
unbind MOUSE5
unbind MOUSE4
unbind z
unbind x
unbind c
unbind q
bind "backspace" "incrementvar r_drawviewmodel 0 1 1"
//cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0
alias dotxhaircolor "dotxhaircolorb"
alias dotxhaircolorb "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0;alias dotxhaircolor dotxhaircolorc"
alias dotxhaircolorc "cl_crosshair_blue 255; cl_crosshair_green 0; cl_crosshair_red 255;alias dotxhaircolor dotxhaircolord"
alias dotxhaircolord "cl_crosshair_blue 0; cl_crosshair_green 255; cl_crosshair_red 0;alias dotxhaircolor dotxhaircolorb"
//bind w "+forward;dotxhaircolor"
//bind a "+moveleft;dotxhaircolor"
//bind s "+back;dotxhaircolor"
//bind d "+moveright;dotxhaircolor"
bind w +mf
bind a +ml
bind s +mb
bind d +mr
bind mouse1 +attack
bind mouse2 +attack2
bind mwheelup slot1
bind mwheeldown +jump
bind r +reload
bind 0 slot10
bind 1 slot1
bind 2 slot2
bind 3 slot3
bind 4 slot4
bind 5 slot5
bind 6 slot6
bind 7 slot7
bind 8 slot8
bind 9 slot9
bind q lastinv
//bind q +use
bind e "voicemenu 0 0"
bind u say_team
bind y say
bind t "impulse 201"
bind g +taunt
bind h +use_action_slot_item
//bind z voice_menu_1
bind z "voicemenu 0 1"
//bind x voice_menu_2
bind x "voicemenu 1 1"
//bind c voice_menu_3
bind c "voicemenu 2 2"
bind , changeclass
bind . changeteam
bind m open_charinfo_direct
bind n "ds_mark INSANE/funnies"
bind ' "ds_mark cheaters"
bind ] "ds_mark demosave"
bind space +jump
bind shift +duck
bind tab +showscores
bind escape cancelselect
bind j cl_trigger_first_notification
bind k cl_decline_first_notification
bind l dropitem
bind b lastdisguise
bind r +reload
bind f +inspect
//bind o "record fix; stop"
bind i "exec overrides/autoexec; snd_restart"
bind o hud_reloadscheme
bind p kill

net_graphpos 1
alias +tabgraph "+showscores; net_graph 1"
alias -tabgraph "-showscores; net_graph 0; timeleft"

alias graphtoggle incrementvar net_graph 0 1 1

bind tab +tabgraph
bind - graphtoggle
