exec overrides/binds

unbind r

//bind mouse4 "disguise 8 -2" //undisguise
//bind mouse5 "slot3" //knife
bind r +reload

bind mouse4 "disguise 1 -2" //disguise as friendly scout to avoid spawn wallhacks from the enemy team
bind mouse5 "disguise 1 -1" //disguise as enemy scout
bind mouse3 "disguise 8 -2" //undisguise
//bind r "disguise 8 -2" //undisguise

// auto disguise script for mvm
alias "autodisgon" "bind mouse1 +disgon; dotxhaircolor; bind ctrl autodisgoff"
alias +disgon "+attack"
alias -disgon "-attack;lastdisguise"
alias "autodisgoff" "bind mouse1 +attack; dotxhaircolor; bind ctrl autodisgon"
bind "ctrl" "autodisgon"
