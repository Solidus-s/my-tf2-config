///---

hud_medicautocallers 1
// 100 - 20.5*2 (2 small first aid kits)
hud_medicautocallersthreshold 59
///---

// Uber
alias "+uber" "slot2;+attack2;say_team "***UBERED***"
alias "-uber" "-attack2;"
bind "mouse2" +uber

// Fake uber
alias "fakeuber" "voicemenu 1 7"
bind "mouse4" "fakeuber"

// Mask uber
alias "maskuber" "voicemenu 2 5"
bind "mouse5" "maskuber"

bind q +radar

alias autocall_default "hud_medicautocallersthreshold 59"
alias autocall_all "hud_medicautocallersthreshold 150"
alias +radar "autocall_all"
alias -radar "autocall_default"
